<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramondrole - Математический тест</title>
    <link rel="icon" href="./Ramondrole.webp">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="math.css">
</head>
<body>
    <nav>
        <div class="logo">RAMONDROLE</div>
        <div class="nav-links">
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-About_me/" data-key="about">Обо мне</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Games/" data-key="games">Наши игры</a>
            <a href="https://ramondrole.github.io/Pogreb_Ramondrole-Userful_functions/" data-key="functions">Полезные функции</a>
        </div>
        <div class="language-switcher">
            <button class="lang-btn" id="langBtn">🌐 RU</button>
            <ul class="lang-dropdown">
                <li><a href="#" data-lang="ru">🇷🇺 Русский</a></li>
                <li><a href="#" data-lang="en">🇺🇸 English</a></li>
                <li><a href="#" data-lang="de">🇩🇪 Deutsch</a></li>
            </ul>
        </div>
    </nav>

    <div class="math-wrapper">
        <h1 id="mainTitle" data-key="mainTitle">Нажми на кнопку и получи задание :-)</h1>
        
        <div class="action-buttons">
            <button class="math-btn add-btn" id="addBtn" data-key="add">Сложить</button>
            <button class="math-btn subtract-btn" id="subtractBtn" data-key="subtract">Вычесть</button>
            <button class="math-btn multiply-btn" id="multiplyBtn" data-key="multiply">Умножить</button>
            <button class="math-btn divide-btn" id="divideBtn" data-key="divide">Разделить</button>
        </div>

        <div class="difficulty-section">
            <p class="difficulty-label" data-key="difficulty">Выбрать уровень</p>
            <select id="difficultySelect">
                <option value="easy" data-key="easy">легкий (от 1 до 9)</option>
                <option value="medium" data-key="medium">средний (от 10 до 99)</option>
                <option value="hard" data-key="hard">тяжелый (от 100 до 999)</option>
            </select>
        </div>

        <div class="stats-buttons">
            <button class="stats-btn check-btn" id="checkBtn" data-key="checkStats">Посмотреть статистику</button>
            <button class="stats-btn reset-btn" id="resetStatsBtn" data-key="resetStats">Сбросить</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="math.js"></script>
</body>
</html>
